<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monblanproject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/air-datepicker/air-datepicker.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page">
  <div class="page__decor page__decor--tl" aria-hidden="true"></div>
  <div class="page__decor page__decor--br" aria-hidden="true"></div>

  <header class="header">
    <div class="header__container">
      <img class="header__logo" src="assets/images/logo.svg" width="138" height="138" alt="monblanproject logo">

      <div class="header__content">
        <div class="header__title-row">
          <h1 class="header__title">monblanproject</h1>
          <button type="button" class="header__badge">Start on 17-02-2016</button>
        </div>

        <ul class="header__stats">
          <li class="header__stat"><strong class="header__stat-value">870</strong> posts</li>
          <li class="header__stat"><strong class="header__stat-value">11,787</strong> followers</li>
          <li class="header__stat"><strong class="header__stat-value">112</strong> following</li>
        </ul>

        <div class="header__dates">
          <span class="header__dates-label">Date</span>

          <label class="date-field">
            <input class="date-field__input" id="date-from" type="text" placeholder="from" readonly>
            <button type="button" class="date-field__clear" data-target="date-from" aria-label="Clear from date"></button>
            <button type="button" class="date-field__trigger" data-target="date-from" aria-label="Open from calendar"></button>
          </label>

          <label class="date-field">
            <input class="date-field__input" id="date-to" type="text" placeholder="to" readonly>
            <button type="button" class="date-field__clear" data-target="date-to" aria-label="Clear to date"></button>
            <button type="button" class="date-field__trigger" data-target="date-to" aria-label="Open to calendar"></button>
          </label>
        </div>
      </div>
  </div>
  </header>

  <main class="main">
    <div class="main__container">
      <div class="view-switcher">
        <button type="button" class="view-switcher__btn view-switcher__btn--tiles view-switcher__btn--active" data-view="tiles" aria-label="Tiles view" aria-pressed="true"></button>
        <button type="button" class="view-switcher__btn view-switcher__btn--rows" data-view="rows" aria-label="Rows view" aria-pressed="false"></button>
      </div>

      <ul class="catalog catalog--tiles" id="catalog"></ul>

      <button type="button" class="button button--load-more">LOAD MORE</button>
    </div>
  </main>

  <script src="vendor/air-datepicker/locale-en.js"></script>
  <script src="vendor/air-datepicker/air-datepicker.js"></script>
  <script src="app.js"></script>
</body>
</html>
